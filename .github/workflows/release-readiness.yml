name: Release readiness
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.6.1 twine==7.0.0 pytest==9.1.1 uv pipx
      - run: python scripts/prepare_pypi_readme.py --check
      - run: python -m build --outdir dist
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_distribution.py dist > dist/manifest.json
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest -q examples/recipes/pytest_fixtures.py
      - run: python examples/recipes/etl_regression.py
      - run: python examples/recipes/importer_bug_repro.py > /tmp/repro.jsonl
      - run: uvx --no-index --from dist/shapewitness-0.1.0-py3-none-any.whl shapewitness --version
      - run: pipx run --no-cache --spec dist/shapewitness-0.1.0-py3-none-any.whl shapewitness --version
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: shapewitness-release-candidates
          path: dist/
          retention-days: 14
          if-no-files-found: error
