# Automatic publishing approved by the repository owner.
name: Publish after main CI
on:
  workflow_run:
    workflows: [CI, Release readiness]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: shapewitness-production-pypi
  cancel-in-progress: false
  queue: max
jobs:
  validate:
    if: >-
      github.repository == 'agent-axiom/shapewitness' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.identity.outputs.publish }}
      version: ${{ steps.identity.outputs.version }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify exact main commit, both CI workflows, version change, and PyPI state
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/validate_main_release.py .
  test:
    if: needs.validate.outputs.publish == 'true'
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: shapewitness examples/events.jsonl -n 4 --require-complete --status json
  build:
    if: needs.validate.outputs.publish == 'true'
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.release_artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.6.1 twine==7.0.0 pytest==9.1.1
      - run: python scripts/prepare_pypi_readme.py --check
      - run: python -m build --outdir dist
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_distribution.py dist > release-manifest.json
      - name: Bind distribution hashes to the validated source
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('release-manifest.json')
          manifest = json.loads(path.read_text())
          manifest['source_commit'] = os.environ['RELEASE_COMMIT']
          path.write_text(json.dumps(manifest, sort_keys=True, indent=2) + '\n')
          PY
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest -q examples/recipes/pytest_fixtures.py examples/recipes/structural_regression.py
      - run: python examples/recipes/etl_regression.py
      - run: python examples/recipes/importer_bug_repro.py > /tmp/repro.jsonl
      - run: python -m pip install -r tests/integration/requirements.txt
      - run: python -m unittest discover -s tests/integration -v
      - run: python examples/recipes/importer_regression.py sqlite-utils
      - run: python examples/recipes/importer_regression.py dlt
      - name: Ensure tests did not change the validated artifacts
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: python scripts/verify_release_manifest.py . "$RELEASE_VERSION" "$RELEASE_COMMIT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        id: release_artifact
        with:
          name: shapewitness-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.source_commit }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            release-manifest.json
          if-no-files-found: error
          retention-days: 14
  publish:
    if: needs.validate.outputs.publish == 'true'
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-artifact
      - name: Verify exact distributions without executing their contents
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: |
          python - release-artifact "$RELEASE_VERSION" "$RELEASE_COMMIT" <<'PY'
          # INLINED_VERIFIER_START
          """Verify the exact two validated distribution files without executing them."""
          import argparse
          import hashlib
          import json
          import re
          from pathlib import Path


          def verify(root, version, commit):
              if not re.fullmatch(r'(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)', version):
                  raise ValueError('Expected a stable three-component version')
              if not re.fullmatch(r'[0-9a-f]{40}', commit):
                  raise ValueError('Expected a full lowercase commit SHA')
              manifest_path = root / 'release-manifest.json'
              if manifest_path.is_symlink() or manifest_path.stat().st_size > 65536:
                  raise ValueError('Invalid release manifest file')
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              if (manifest.get('package') != 'shapewitness' or manifest.get('version') != version
                      or manifest.get('source_commit') != commit):
                  raise ValueError('Release identity does not match the validated source')
              expected = {f'shapewitness-{version}-py3-none-any.whl', f'shapewitness-{version}.tar.gz'}
              artifacts = manifest.get('artifacts', [])
              if len(artifacts) != 2 or {entry.get('filename') for entry in artifacts} != expected:
                  raise ValueError('Expected exactly the validated wheel and source archive')
              dist = root / 'dist'
              if dist.is_symlink() or {p.name for p in dist.iterdir()} != expected:
                  raise ValueError('Unexpected files in the publishing directory')
              for entry in artifacts:
                  path = dist / entry['filename']
                  if (path.is_symlink() or not path.is_file() or
                          path.stat().st_size != entry.get('bytes') or path.stat().st_size > 64 * 1024 * 1024):
                      raise ValueError('Distribution size/type does not match the manifest')
                  digest = hashlib.sha256()
                  with path.open('rb') as source:
                      for chunk in iter(lambda: source.read(1024 * 1024), b''):
                          digest.update(chunk)
                  if digest.hexdigest() != entry.get('sha256'):
                      raise ValueError('Distribution digest does not match the validated artifact')
              return manifest


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('directory', type=Path)
              parser.add_argument('version')
              parser.add_argument('commit')
              args = parser.parse_args()
              verify(args.directory, args.version, args.commit)
              print(f'Verified exact distribution bytes: shapewitness {args.version} at {args.commit}')


          if __name__ == '__main__':
              main()
          # INLINED_VERIFIER_END
          PY
      - name: Recheck CI and PyPI immediately before upload
        id: final_gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: |
          python - --ready-to-upload "$RELEASE_VERSION" "$RELEASE_COMMIT" <<'PY'
          # INLINED_MAIN_GATE_START
          """Fail-closed main-CI/version gate; only the publish action receives the PyPI token."""
          import argparse
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          REPOSITORY = 'agent-axiom/shapewitness'
          WORKFLOWS = {'.github/workflows/ci.yml': 'CI',
                       '.github/workflows/release-readiness.yml': 'Release readiness'}
          VERSION_PATTERN = r'(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)'


          def version_tuple(version):
              if not isinstance(version, str) or not re.fullmatch(VERSION_PATTERN, version):
                  raise ValueError('Expected a stable three-component version without leading zeroes')
              return tuple(map(int, version.split('.')))


          def event_commit(event):
              run = event.get('workflow_run', {})
              if (event.get('action') != 'completed'
                      or event.get('repository', {}).get('full_name') != REPOSITORY
                      or run.get('head_repository', {}).get('full_name') != REPOSITORY
                      or run.get('event') != 'push' or run.get('head_branch') != 'main'
                      or run.get('path') not in WORKFLOWS
                      or run.get('name') != WORKFLOWS[run['path']]
                      or run.get('status') != 'completed' or run.get('conclusion') != 'success'):
                  raise ValueError('Expected successful trusted main-push CI completion')
              sha = run.get('head_sha', '')
              if not re.fullmatch(r'[0-9a-f]{40}', sha):
                  raise ValueError('Expected an immutable full commit SHA')
              return sha


          def all_ci_successful(runs, sha):
              """Use the newest run, including in-progress/failed reruns, for each workflow."""
              for path in WORKFLOWS:
                  matches = [run for run in runs if run.get('path') == path
                             and run.get('name') == WORKFLOWS[path]
                             and run.get('head_sha') == sha and run.get('head_branch') == 'main'
                             and run.get('event') == 'push'
                             and run.get('head_repository', {}).get('full_name') == REPOSITORY]
                  if not matches:
                      return False
                  latest = max(matches, key=lambda run: (run['id'], run.get('run_attempt', 1)))
                  if latest.get('status') != 'completed' or latest.get('conclusion') != 'success':
                      return False
              return True


          def read_json(url, token=None, missing_ok=False):
              headers = {'Accept': 'application/json', 'User-Agent': 'shapewitness-release-gate'}
              if token:
                  # Never send the GitHub read token to PyPI or a caller-selected host.
                  if not url.startswith('https://api.github.com/repos/' + REPOSITORY + '/'):
                      raise ValueError('Unexpected authenticated API destination')
                  headers['Authorization'] = 'Bearer ' + token
                  headers['X-GitHub-Api-Version'] = '2022-11-28'
              try:
                  with urlopen(Request(url, headers=headers), timeout=30) as response:
                      return json.load(response)
              except HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  raise


          def fetch_ci(sha):
              query = urlencode({'branch': 'main', 'event': 'push', 'head_sha': sha, 'per_page': 100})
              runs = []
              for path in WORKFLOWS:
                  url = ('https://api.github.com/repos/' + REPOSITORY + '/actions/workflows/'
                         + path.rsplit('/', 1)[1] + '/runs?' + query)
                  result = read_json(url, os.environ['GH_TOKEN'])
                  page = result['workflow_runs']
                  if result['total_count'] != len(page):
                      raise ValueError('Incomplete CI history; refusing to select an older successful run')
                  runs.extend(page)
              return runs


          def source_identity(repo, sha):
              import tomllib

              def git(*args):
                  return subprocess.check_output(['git', '-C', str(repo), *args], text=True).strip()

              if git('rev-parse', '--verify', 'HEAD^{commit}') != sha:
                  raise ValueError('Checkout does not match the successful CI commit')
              main = git('rev-parse', '--verify', 'refs/remotes/origin/main^{commit}')
              ancestry = subprocess.run(['git', '-C', str(repo), 'merge-base', '--is-ancestor', sha, main],
                                        capture_output=True, text=True)
              if ancestry.returncode != 0:
                  raise ValueError('Release commit is not on fetched main history')
              project = tomllib.loads((repo / 'pyproject.toml').read_text())['project']
              previous = tomllib.loads(git('show', sha + '^1:pyproject.toml'))['project']
              if project.get('name') != 'shapewitness' or previous.get('name') != 'shapewitness':
                  raise ValueError('Unexpected package identity')
              version, old = project['version'], previous['version']
              current_tuple, old_tuple = version_tuple(version), version_tuple(old)
              if current_tuple < old_tuple:
                  raise ValueError('Release version must not decrease')
              return version, current_tuple > old_tuple


          def published_release(document, version):
              """Complete existing releases are no-ops; partial releases require investigation."""
              version_tuple(version)
              if document is None:
                  return False
              info = document.get('info', {})
              if info.get('name') != 'shapewitness' or info.get('version') != version:
                  raise ValueError('PyPI returned an unexpected package identity')
              expected = {f'shapewitness-{version}-py3-none-any.whl', f'shapewitness-{version}.tar.gz'}
              files = document.get('urls', [])
              if len(files) != 2 or {item.get('filename') for item in files} != expected:
                  raise ValueError('Existing PyPI release is partial or unexpected; never rebuild/reupload it')
              return True


          def gate(event, runs, version, changed, document):
              sha = event_commit(event)
              version_tuple(version)
              result = {'source_commit': sha, 'version': version, 'publish': False}
              if not all_ci_successful(runs, sha):
                  result['reason'] = 'Waiting for successful CI and Release readiness on this exact main commit'
              elif not changed:
                  result['reason'] = 'Version unchanged from the first parent; nothing to publish'
              elif published_release(document, version):
                  result['reason'] = 'Version already exists on PyPI; nothing to publish'
              else:
                  result.update(publish=True, reason='New version and both exact-commit workflows succeeded')
              return result


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('repository', type=Path, nargs='?')
              parser.add_argument('--ready-to-upload', nargs=2, metavar=('VERSION', 'COMMIT'))
              args = parser.parse_args()
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              sha = event_commit(event)
              if args.ready_to_upload:
                  version, expected_sha = args.ready_to_upload
                  if sha != expected_sha:
                      raise ValueError('Upload identity differs from CI identity')
                  changed = True  # The earlier source gate already verified the version bump.
              elif args.repository is not None:
                  version, changed = source_identity(args.repository, sha)
              else:
                  parser.error('repository or --ready-to-upload is required')
              version_tuple(version)
              runs = fetch_ci(sha)
              document = None
              if changed and all_ci_successful(runs, sha):
                  document = read_json('https://pypi.org/pypi/shapewitness/' + version + '/json', missing_ok=True)
              result = gate(event, runs, version, changed, document)
              print(json.dumps(result, sort_keys=True))
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  for key in ('version', 'source_commit', 'publish'):
                      value = str(result[key]).lower() if key == 'publish' else result[key]
                      output.write(key + '=' + value + '\n')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('ShapeWitness ' + version + ': ' + result['reason'] + '\n')


          if __name__ == '__main__':
              main()
          # INLINED_MAIN_GATE_END
          PY
      - name: Check that the owner configured the upload secret
        if: steps.final_gate.outputs.publish == 'true'
        env:
          HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
        run: test "$HAS_PYPI_TOKEN" = true || { echo 'PYPI_API_TOKEN is not configured'; exit 1; }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        if: steps.final_gate.outputs.publish == 'true'
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: release-artifact/dist/
          attestations: false
          skip-existing: false
          print-hash: true
